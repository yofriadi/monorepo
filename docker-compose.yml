services:
  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://rest:3002
    depends_on:
      - rest
    networks:
      - scraping-network

  rest:
    build:
      context: .
      dockerfile: apps/rest/Dockerfile
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
      - postgres
    networks:
      - scraping-network

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY}
    depends_on:
      - redis
      - postgres
    networks:
      - scraping-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - scraping-network

  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-luxehouze}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - scraping-network

volumes:
  redis-data:
  postgres-data:

networks:
  scraping-network:
    driver: bridge
