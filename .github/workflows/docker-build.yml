name: Build Docker Images

on:
  push:
    branches:
      - master
    paths:
      - 'apps/rest/**'
      - 'apps/worker/**'
      - 'apps/dashboard/**'
      - '.github/workflows/docker-build.yml'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      rest: ${{ steps.changes.outputs.rest }}
      worker: ${{ steps.changes.outputs.worker }}
      dashboard: ${{ steps.changes.outputs.dashboard }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            rest:
              - 'apps/rest/**'
            worker:
              - 'apps/worker/**'
            dashboard:
              - 'apps/dashboard/**'

  build-rest:
    needs: detect-changes
    if: needs.detect-changes.outputs.rest == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push REST API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/rest/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/rest:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/rest:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/rest:buildcache,mode=max

  build-worker:
    needs: detect-changes
    if: needs.detect-changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Worker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/worker/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/worker:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/worker:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/worker:buildcache,mode=max

  build-dashboard:
    needs: detect-changes
    if: needs.detect-changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Dashboard
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/dashboard/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/dashboard:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/dashboard:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/dashboard:buildcache,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}

