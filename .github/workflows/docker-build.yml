name: Deployment

on:
  push:
    branches:
      - master
    paths:
      - 'apps/rest/**'
      - 'apps/scraping/**'
      - '.github/workflows/docker-build.yml'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      rest: ${{ steps.changes.outputs.rest }}
      trigger: ${{ steps.changes.outputs.trigger }}
      scraping: ${{ steps.changes.outputs.scraping }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            rest:
              - 'apps/rest/**'
              - '!apps/rest/trigger/**'
              - '!apps/rest/script/**'
            trigger:
              - 'apps/rest/trigger/**'
              - 'apps/rest/script/**'
            scraping:
              - 'apps/scraping/**'

  deploy-rest:
    needs: detect-changes
    if: needs.detect-changes.outputs.rest == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push REST API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/rest/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/rest:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/rest:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/rest:buildcache,mode=max

  deploy-trigger:
    needs: detect-changes
    if: needs.detect-changes.outputs.trigger == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Install dependencies
        run: npm install

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚀 Deploy Trigger.dev
        env:
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
          TRIGGER_API_URL: ${{ secrets.TRIGGER_API_URL }}
        run: |
          npx trigger.dev@latest deploy --self-hosted --push

  deploy-scraping:
    needs: detect-changes
    if: needs.detect-changes.outputs.scraping == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Scraping
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/scraping/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/scraping:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/scraping:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/scraping:buildcache,mode=max
          secrets: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_STACK_PROJECT_ID=${{ secrets.NEXT_PUBLIC_STACK_PROJECT_ID }}
            NEXT_PUBLIC_STACK_PUBLISHABLE_CLIENT_KEY=${{ secrets.NEXT_PUBLIC_STACK_PUBLISHABLE_CLIENT_KEY }}
            STACK_SECRET_SERVER_KEY=${{ secrets.STACK_SECRET_SERVER_KEY }}
